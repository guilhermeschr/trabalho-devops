info:
  name: "2.3 Editar produto (200)"
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/products/{{productId}}"
  body:
    type: json
    data: |-
      {
        "name": "Hambúrguer artesanal especial",
        "description": "Hambúrguer com queijo, bacon e molho especial",
        "price": 34.9,
        "active": true
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "Gera `product.updated`."
