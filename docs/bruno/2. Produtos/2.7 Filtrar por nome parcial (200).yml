info:
  name: "2.7 Filtrar por nome parcial (200)"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products?name=especial"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
