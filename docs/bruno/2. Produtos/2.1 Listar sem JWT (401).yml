info:
  name: "2.1 Listar sem JWT (401)"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "`UNAUTHORIZED`: JWT validado localmente em cada serviço."
