http:
  method: GET
  url: "{{baseUrl}}/api/v1/inventory/{{productId}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        await bru.sleep(1000); // aguarda a projeção (consistência eventual)
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

