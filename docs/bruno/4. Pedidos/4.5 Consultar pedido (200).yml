info:
  name: "4.5 Consultar pedido (200)"
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/orders/{{orderId}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
