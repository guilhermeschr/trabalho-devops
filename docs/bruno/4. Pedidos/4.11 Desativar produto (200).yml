info:
  name: "4.11 Desativar produto (200)"
  type: http
  seq: 11

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/products/{{productId}}"
  body:
    type: json
    data: |-
      {
        "name": "Hambúrguer artesanal especial",
        "description": "Fora do cardápio",
        "price": 34.9,
        "active": false
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
