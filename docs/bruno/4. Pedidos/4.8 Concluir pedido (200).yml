info:
  name: "4.8 Concluir pedido (200)"
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/orders/{{orderId}}/complete"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "`CREATED → COMPLETED`."
