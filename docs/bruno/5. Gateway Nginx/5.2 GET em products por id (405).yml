info:
  name: "5.2 GET em products por id (405)"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/{{productId}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "405"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "`METHOD_NOT_ALLOWED`, header `Allow: PUT`."
