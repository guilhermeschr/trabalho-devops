info:
  name: "1.4 Login usuário A (200)"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{emailA}}",
        "password": "{{senha}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.accessToken
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "Grava `token`. Decodifique em jwt.io: `sub`, `email`, `iat`, `exp` (HS256)."
