info:
  name: "1.3 Senha curta (400)"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "Maria",
        "email": "curta@example.com",
        "password": "123"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "`VALIDATION_ERROR`."
