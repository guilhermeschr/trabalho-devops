info:
  name: "1.2 E-mail duplicado (409)"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "Maria Silva",
        "email": "{{emailA}}",
        "password": "{{senha}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "`EMAIL_ALREADY_REGISTERED`."
