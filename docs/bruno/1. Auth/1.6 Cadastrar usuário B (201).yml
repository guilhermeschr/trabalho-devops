info:
  name: "1.6 Cadastrar usuário B (201)"
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "João Souza",
        "email": "{{emailB}}",
        "password": "{{senha}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("emailB", `joao-${Date.now()}@example.com`);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
