info:
  name: "1.5 Login com senha errada (401)"
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{emailA}}",
        "password": "errada123"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "`INVALID_CREDENTIALS`, sem revelar se o e-mail existe."
