info:
  name: "1.1 Cadastrar usuário A (201)"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register"
  body:
    type: json
    data: |-
      {
        "name": "Maria Silva",
        "email": "{{emailA}}",
        "password": "{{senha}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("emailA", `maria-${Date.now()}@example.com`);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "Resposta sem senha. Gera `emailA` único."
