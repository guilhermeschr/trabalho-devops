info:
  name: "6.1 Criar pedido com Estoque parado (503)"
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/orders"
  body:
    type: json
    data: |-
      {
        "productId": "{{productId}}",
        "quantity": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "503"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "`DEPENDENCY_UNAVAILABLE` - \"Serviço de Estoque indisponível\"."
