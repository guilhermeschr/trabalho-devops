name: delivery
services:
  auth-service:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_PORT: 3000
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 5432
      AUTH_DB_NAME: auth
      AUTH_DB_USER: auth
      AUTH_DB_PASSWORD: auth
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - delivery-private
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - auth-data:/var/lib/postgresql/data
    networks:
      - delivery-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  products-service:
    build:
      context: ../..
      dockerfile: services/products/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PRODUCTS_PORT: 3000
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-development}
      PRODUCTS_WRITE_DB_HOST: products-write-db
      PRODUCTS_WRITE_DB_PORT: 5432
      PRODUCTS_WRITE_DB_NAME: products_write
      PRODUCTS_WRITE_DB_USER: products
      PRODUCTS_WRITE_DB_PASSWORD: products
      PRODUCTS_READ_DB_HOST: products-read-db
      PRODUCTS_READ_DB_PORT: 5432
      PRODUCTS_READ_DB_NAME: products_read
      PRODUCTS_READ_DB_USER: products
      PRODUCTS_READ_DB_PASSWORD: products
      RABBITMQ_URL: amqp://products:products@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-delivery.events}
      RABBITMQ_PRODUCTS_QUEUE: ${RABBITMQ_PRODUCTS_QUEUE:-products.read.projector}
    depends_on:
      products-write-db:
        condition: service_healthy
      products-read-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - delivery-private
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  products-write-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products_write
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
    volumes:
      - products-write-data:/var/lib/postgresql/data
    networks:
      - delivery-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products_write"]
      interval: 5s
      timeout: 5s
      retries: 10

  products-read-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products_read
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
    volumes:
      - products-read-data:/var/lib/postgresql/data
    networks:
      - delivery-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products_read"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-service:
    build:
      context: ../..
      dockerfile: services/inventory/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      INVENTORY_PORT: 3000
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-development}
      INVENTORY_WRITE_DB_HOST: inventory-write-db
      INVENTORY_WRITE_DB_PORT: 5432
      INVENTORY_WRITE_DB_NAME: inventory_write
      INVENTORY_WRITE_DB_USER: inventory
      INVENTORY_WRITE_DB_PASSWORD: inventory
      INVENTORY_READ_DB_HOST: inventory-read-db
      INVENTORY_READ_DB_PORT: 5432
      INVENTORY_READ_DB_NAME: inventory_read
      INVENTORY_READ_DB_USER: inventory
      INVENTORY_READ_DB_PASSWORD: inventory
      RABBITMQ_URL: amqp://products:products@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-delivery.events}
      RABBITMQ_INVENTORY_QUEUE: ${RABBITMQ_INVENTORY_QUEUE:-inventory.read.projector}
    depends_on:
      inventory-write-db:
        condition: service_healthy
      inventory-read-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - delivery-private
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  inventory-write-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory_write
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory-write-data:/var/lib/postgresql/data
    networks:
      - delivery-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_write"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-read-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory_read
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory-read-data:/var/lib/postgresql/data
    networks:
      - delivery-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_read"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-service:
    build:
      context: ../..
      dockerfile: services/orders/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ORDERS_PORT: 3000
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-development}
      ORDERS_DB_HOST: orders-db
      ORDERS_DB_PORT: 5432
      ORDERS_DB_NAME: orders
      ORDERS_DB_USER: orders
      ORDERS_DB_PASSWORD: orders
      PRODUCTS_SERVICE_URL: http://products-service:3000
      INVENTORY_SERVICE_URL: http://inventory-service:3000
      ORDERS_HTTP_TIMEOUT_MS: ${ORDERS_HTTP_TIMEOUT_MS:-3000}
    depends_on:
      orders-db:
        condition: service_healthy
      products-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - delivery-private
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - orders-data:/var/lib/postgresql/data
    networks:
      - delivery-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: products
      RABBITMQ_DEFAULT_PASS: products
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - delivery-private
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  nginx-gateway:
    image: nginx:1.27-alpine
    ports:
      - "${PRODUCTS_PUBLIC_PORT:-8080}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      products-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    networks:
      - delivery-private
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-check:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: scripts/Dockerfile.inventory-check
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-internal-development}
      INVENTORY_INTERNAL_URL: http://inventory-service:3000
      INVENTORY_WRITE_DB_HOST: inventory-write-db
      INVENTORY_WRITE_DB_USER: inventory
      INVENTORY_WRITE_DB_PASSWORD: inventory
      INVENTORY_WRITE_DB_NAME: inventory_write
      RABBITMQ_URL: amqp://products:products@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-delivery.events}
    depends_on:
      inventory-service:
        condition: service_healthy
      nginx-gateway:
        condition: service_healthy
    networks:
      - delivery-private

networks:
  delivery-private:
    driver: bridge

volumes:
  auth-data:
  products-write-data:
  products-read-data:
  rabbitmq-data:
  inventory-write-data:
  inventory-read-data:
  orders-data:
