name: Inventory
on:
  push:
    branches: [main, develop, 'feature/**']
    paths: ['services/inventory/**', '.github/workflows/inventory.yml', '.github/dependabot.yml', 'scripts/deploy-inventory.py', 'scripts/test_deploy_inventory.py', 'monitoring/inventory/**']
  pull_request:
    branches: [main, develop]
    paths: ['services/inventory/**', '.github/workflows/inventory.yml', '.github/dependabot.yml', 'scripts/deploy-inventory.py', 'scripts/test_deploy_inventory.py', 'monitoring/inventory/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/inventory/pom.xml
      - name: Build, testes e cobertura
        run: mvn -B -f services/inventory/pom.xml verify
      - name: Testar controle de deploy
        run: python3 -m unittest discover -s scripts -p test_deploy_inventory.py
      - name: Sonar e Quality Gate
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          SONAR_TOKEN: ${{ secrets.INVENTORY_SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.INVENTORY_SONAR_ORGANIZATION || secrets.INVENTORY_SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.INVENTORY_SONAR_PROJECT_KEY || secrets.INVENTORY_SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo 'Configure INVENTORY_SONAR_TOKEN em Secrets e os identificadores Sonar em Variables ou Secrets.'
            exit 1
          fi
          mvn -B -f services/inventory/pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600
      - name: Relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-reports
          path: |
            services/inventory/target/surefire-reports/
            services/inventory/target/failsafe-reports/
            services/inventory/target/site/jacoco/
  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.app.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Nomes e versao
        id: names
        shell: python
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          import os, re, xml.etree.ElementTree as ET
          version = ET.parse('services/inventory/pom.xml').getroot().find('{*}version').text
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Use uma versao SemVer X.Y.Z no pom.xml')
          image = 'ghcr.io/' + os.environ['REPOSITORY'].lower() + '-inventory'
          suffix = '-homol' if os.environ['BRANCH'] == 'main' else '-dev'
          tag = version + suffix + '-' + os.environ['SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'image={image}\ntag={tag}\n')
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagem Spring
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/inventory/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          cache-from: type=gha,scope=inventory
          cache-to: type=gha,mode=max,scope=inventory
  deploy:
    needs: image
    if: vars.INVENTORY_DEPLOY_ENABLED == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ github.ref == 'refs/heads/main' && 'HOMOL' || 'DEV' }}
    concurrency:
      group: inventory-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      RENDER_API_KEY: ${{ secrets.INVENTORY_RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.INVENTORY_RENDER_SERVICE_ID }}
      APP_URL: ${{ vars.INVENTORY_APP_URL }}
      APP_ENV: ${{ github.ref == 'refs/heads/main' && 'homol' || 'dev' }}
      IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Implantar e validar o Inventory
        run: python3 scripts/deploy-inventory.py
