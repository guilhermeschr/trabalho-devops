spring.application.name=inventory-service
server.port=${INVENTORY_PORT:3000}
spring.flyway.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.api-docs.path=/docs-json
springdoc.api-docs.version=OPENAPI_3_0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**,/internal/**,/health
springdoc.override-with-generic-response=false
inventory.write.url=jdbc:postgresql://${INVENTORY_WRITE_DB_HOST:localhost}:${INVENTORY_WRITE_DB_PORT:5432}/${INVENTORY_WRITE_DB_NAME:inventory_write}
inventory.write.username=${INVENTORY_WRITE_DB_USER:inventory}
inventory.write.password=${INVENTORY_WRITE_DB_PASSWORD}
inventory.read.url=jdbc:postgresql://${INVENTORY_READ_DB_HOST:localhost}:${INVENTORY_READ_DB_PORT:5432}/${INVENTORY_READ_DB_NAME:inventory_read}
inventory.read.username=${INVENTORY_READ_DB_USER:inventory}
inventory.read.password=${INVENTORY_READ_DB_PASSWORD}
inventory.rabbitmq.url=${RABBITMQ_URL}
inventory.rabbitmq.exchange=${RABBITMQ_EXCHANGE:delivery.events}
inventory.rabbitmq.queue=${RABBITMQ_INVENTORY_QUEUE:inventory.read.projector}
inventory.jwt-secret=${JWT_SECRET}
inventory.internal-token=${INTERNAL_SERVICE_TOKEN}
