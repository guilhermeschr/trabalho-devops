global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: inventory-dev
    scheme: https
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/dev_metrics_token
    file_sd_configs:
      - files: [/etc/prometheus/targets/dev.json]
  - job_name: inventory-homol
    scheme: https
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/homol_metrics_token
    file_sd_configs:
      - files: [/etc/prometheus/targets/homol.json]
