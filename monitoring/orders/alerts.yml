groups:
  - name: orders
    rules:
      - alert: OrdersScrapeDown
        expr: up{job=~"orders-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Métricas de Pedidos indisponíveis em {{ $labels.environment }}'
      - alert: OrdersHighErrorRate
        expr: sum by (environment) (rate(http_requests_total{service="orders-service",status=~"5.."}[5m])) / clamp_min(sum by (environment) (rate(http_requests_total{service="orders-service"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Mais de 5% de erros em Pedidos em {{ $labels.environment }}'
      - alert: OrdersDependencyUnavailable
        expr: sum by (environment) (increase(http_requests_total{service="orders-service",route="/api/v1/orders",method="POST",status="503"}[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Pedidos recebeu falha de Produtos ou Estoque (503) em {{ $labels.environment }}'
