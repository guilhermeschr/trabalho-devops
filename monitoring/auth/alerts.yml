groups:
  - name: auth
    rules:
      - alert: AuthScrapeDown
        expr: up{job=~"auth-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Métricas de Auth indisponíveis em {{ $labels.environment }}'
      - alert: AuthHighErrorRate
        expr: sum by (environment) (rate(http_requests_total{service="auth-service",status=~"5.."}[5m])) / clamp_min(sum by (environment) (rate(http_requests_total{service="auth-service"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Mais de 5% de erros em Auth em {{ $labels.environment }}'
